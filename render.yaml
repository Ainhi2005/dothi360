services:
  - type: web
    name: dothi360
    runtime: node
    plan: free
    buildCommand: node scripts/build-render.cjs
    startCommand: cd BE && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: SERVE_ADMIN
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
