name: urban_issue_app
description: Giao dien he thong phan anh su co do thi
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  image_picker: ^1.2.2
  flutter_map: ^8.3.2
  latlong2: 0.9.1
  geolocator: ^14.0.2
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.1
  geocoding: ^5.0.0
  url_launcher: ^6.3.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  path_provider: ^2.1.5
  flutter_map_marker_cluster: 8.2.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/main_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/main_logo.png
  adaptive_icon_foreground_inset: 22
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/HaNoi/
    - assets/images/
